replicaCount: 1

fullnameOverride: cloud-native-demo

image:
  repository: cloud-native-demo
  tag: dev
  pullPolicy: IfNotPresent

ingress:
  hosts:
    - host: cloud-native-demo.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60

env:
  LOG_LEVEL: DEBUG
  APP_VERSION: dev
