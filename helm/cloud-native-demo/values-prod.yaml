replicaCount: 3

fullnameOverride: cloud-native-demo

image:
  repository: ghcr.io/emara7/cloud-native-demo
  tag: stable
  pullPolicy: IfNotPresent

ingress:
  hosts:
    - host: demo.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65

env:
  LOG_LEVEL: INFO
  APP_VERSION: prod

serviceMonitor:
  enabled: true
  interval: 15s
