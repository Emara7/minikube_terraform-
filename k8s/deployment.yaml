apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-native-demo
  labels:
    app.kubernetes.io/name: cloud-native-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-native-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-native-demo
    spec:
      containers:
        - name: app
          image: ghcr.io/emara7/cloud-native-demo:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: INFO
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
