name: Build image and update Helm chart

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - helm/cloud-native-demo/**
      - .github/workflows/build-and-update-chart.yaml
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cloud-native-demo

jobs:
  build-and-update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Helm image tag
        uses: mikefarah/yq@v4.44.3
        with:
          cmd: yq -i '.image.repository = strenv(IMAGE_REPOSITORY) | .image.tag = strenv(IMAGE_TAG)' helm/cloud-native-demo/values-prod.yaml
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: sha-${{ github.sha }}

      - name: Commit chart update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update demo image tag"
          file_pattern: helm/cloud-native-demo/values-prod.yaml
